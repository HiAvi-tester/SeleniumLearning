name: Maven CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: 'TestNG suite file'
        default: 'testng.xml'
        type: choice
        options: [testng.xml, testng-smoke.xml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Published report; its history/ folder feeds the Allure Trend graph on the next run.
  PAGES_URL: https://hiavi-tester.github.io/java-selenium-restassured-hybrid

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Chrome is preinstalled on GitHub-hosted Ubuntu runners; Selenium Manager fetches the matching driver.
      - name: Run tests (headless Chrome)
        run: mvn -B test -Dheadless=true -Dbrowser=chrome -Dsuite=${{ inputs.suite || 'testng.xml' }}

      # Best effort: missing files (first deploy, Pages not enabled yet) are simply skipped.
      - name: Restore Allure history from the published report
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target/allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -sfL "$PAGES_URL/history/$f" -o "target/allure-results/history/$f" || echo "no previous $f"
          done

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: mvn -B -q allure:report

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

      # Uploaded even when tests fail, so the live report shows the failures.
      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin

  deploy:
    needs: test
    # Runs after a passing or failing test job, but not when cancelled or on PRs.
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
